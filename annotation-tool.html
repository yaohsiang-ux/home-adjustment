<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>居家無障礙 評估標註工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;overflow:hidden}
body{font-family:'Noto Sans TC',sans-serif;background:#111;color:#eee}
button:disabled{opacity:.35;cursor:not-allowed!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

/* ═══════ Fixture SVG ═══════ */
function ToiletSVG(){return <g><rect x={-18} y={-30} width={36} height={14} rx={2} fill="#fff" stroke="#333" strokeWidth={2}/><ellipse cx={0} cy={6} rx={16} ry={22} fill="#fff" stroke="#333" strokeWidth={2}/><line x1={-5} y1={-8} x2={-5} y2={24} stroke="#aaa" strokeWidth={1}/><line x1={5} y1={-8} x2={5} y2={24} stroke="#aaa" strokeWidth={1}/></g>}
function SinkSVG(){return <g><rect x={-20} y={-14} width={40} height={28} rx={4} fill="#fff" stroke="#333" strokeWidth={2}/><rect x={-14} y={-8} width={28} height={16} rx={2} fill="none" stroke="#aaa" strokeWidth={1}/><rect x={-3} y={-18} width={6} height={6} fill="#888"/></g>}
function BathtubSVG(){return <g><rect x={-24} y={-42} width={48} height={84} rx={4} fill="#fff" stroke="#333" strokeWidth={2}/><rect x={-20} y={-38} width={40} height={76} rx={2} fill="none" stroke="#aaa" strokeWidth={1}/></g>}
function ShowerSVG(){return <g><circle cx={0} cy={0} r={26} fill="#fff" stroke="#333" strokeWidth={2}/><circle cx={0} cy={0} r={6} fill="#999"/>{[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3;return <line key={i} x1={Math.cos(a)*9} y1={Math.sin(a)*9} x2={Math.cos(a)*18} y2={Math.sin(a)*18} stroke="#bbb" strokeWidth={1}/>})}</g>}
function DoorSVG(){return <g><line x1={0} y1={0} x2={-48} y2={0} stroke="#333" strokeWidth={3}/><line x1={0} y1={0} x2={0} y2={-48} stroke="#333" strokeWidth={2}/><path d="M0,-48 A48,48 0 0,0 -48,0" fill="none" stroke="#999" strokeWidth={1.5} strokeDasharray="4,3"/></g>}

const FIX_MAP={toilet:ToiletSVG,sink:SinkSVG,bathtub:BathtubSVG,shower:ShowerSVG,door:DoorSVG};
const FIX_LBL={toilet:"馬桶",sink:"洗手台",bathtub:"浴缸/木桶",shower:"淋浴區",door:"門"};
const FIX_EMJ={toilet:"🚽",sink:"🚰",bathtub:"🛁",shower:"🚿",door:"🚪"};

/* ═══════ 常數 / 快速選項 ═══════ */
const GRID=20;
const SAVE_KEY="cps_state_v2";
const QUICK={
  "輸入尺寸":["60公分","70公分","75公分","80公分","85公分","90公分","120公分"],
  "第一段尺寸":["60公分","70公分","80公分"],
  "第二段尺寸":["40公分","50公分","60公分"],
  "離地描述":["水平扶手上緣離地約70公分","水平扶手上緣離地約75公分","L型扶手垂直段離地約70公分","馬桶座面離地約40公分","洗手台上緣離地約80公分"],
  "輸入文字":["建議加裝扶手","建議加裝防滑墊","門檻建議拆除","建議加裝止滑條","建議加裝洗澡椅"],
};
const loadRecent=k=>{try{return JSON.parse(localStorage.getItem("cps_recent_"+k)||"[]")}catch(e){return[]}};
const saveRecent=(k,v)=>{if(!v)return;try{const r=[v,...loadRecent(k).filter(x=>x!==v)].slice(0,6);localStorage.setItem("cps_recent_"+k,JSON.stringify(r))}catch(e){}};

/* ═══════ 幾何工具：命中測試 / 外框 / 位移 ═══════ */
const distSeg=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=l2?((p.x-a.x)*dx+(p.y-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))};
const lblW=t=>t.length*16*0.7+20, LBL_H=28;
const segsOf=it=>{
  if(it.type==="lshape")return[[{x:it.x1,y:it.y1},{x:it.mx,y:it.my}],[{x:it.mx,y:it.my},{x:it.x2,y:it.y2}]];
  if(it.type==="arrow")return[[{x:it.x,y:it.y1},{x:it.x,y:it.y2}]];
  if("x1" in it)return[[{x:it.x1,y:it.y1},{x:it.x2,y:it.y2}]];
  return[];
};
const labelsOf=it=>{
  const L=[];
  if(it.type==="line"&&it.label)L.push({x:(it.x1+it.x2)/2,y:(it.y1+it.y2)/2-25,text:it.label});
  if(it.type==="lshape"){if(it.label1)L.push({x:(it.x1+it.mx)/2,y:(it.y1+it.my)/2-25,text:it.label1});if(it.label2)L.push({x:(it.mx+it.x2)/2,y:(it.my+it.y2)/2-25,text:it.label2})}
  if(it.type==="arrow"&&it.label)L.push({x:it.x,y:it.y2+25,text:it.label});
  if(it.type==="text"&&it.label)L.push({x:it.x,y:it.y,text:it.label});
  if(it.type==="dim"&&it.label)L.push({x:(it.x1+it.x2)/2,y:(it.y1+it.y2)/2-8,text:it.label});
  return L;
};
const bboxOf=it=>{
  let pts=[];
  if(it.type==="fixture"){const s=40*(it.scale||1);pts=[{x:it.x-s,y:it.y-s},{x:it.x+s,y:it.y+s}]}
  else{segsOf(it).forEach(s=>pts.push(...s));labelsOf(it).forEach(l=>{const w=lblW(l.text)/2;pts.push({x:l.x-w,y:l.y-LBL_H/2},{x:l.x+w,y:l.y+LBL_H/2})})}
  if(!pts.length)pts=[{x:it.x||0,y:it.y||0}];
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),pad=8;
  return{x1:Math.min(...xs)-pad,y1:Math.min(...ys)-pad,x2:Math.max(...xs)+pad,y2:Math.max(...ys)+pad};
};
const hitItem=(it,p)=>{
  const T=14;
  if(it.type==="fixture"||it.type==="text"){const b=bboxOf(it);return p.x>=b.x1&&p.x<=b.x2&&p.y>=b.y1&&p.y<=b.y2}
  if(segsOf(it).some(([a,b])=>distSeg(p,a,b)<T))return true;
  return labelsOf(it).some(l=>Math.abs(p.x-l.x)<lblW(l.text)/2+4&&Math.abs(p.y-l.y)<LBL_H/2+4);
};
const shiftItem=(it,dx,dy)=>{const o={...it};["x","x1","x2","mx"].forEach(k=>{if(k in o)o[k]+=dx});["y","y1","y2","my"].forEach(k=>{if(k in o)o[k]+=dy});return o};

function YellowLabel({x,y,text}){
  if(!text)return null;
  const fs=16,w=lblW(text),h=LBL_H;
  return <g><rect x={x-w/2} y={y-h/2} width={w} height={h} rx={5} fill="rgba(255,214,0,0.92)"/><text x={x} y={y+fs*0.35} textAnchor="middle" fontFamily="'Noto Sans TC',sans-serif" fontWeight="900" fontSize={fs} fill="#000">{text}</text></g>;
}

/* ═══════ App ═══════ */
function App(){
  const [mode,setMode]=useState("photo");
  const [photoSrc,setPhotoSrc]=useState(null);
  const [pTool,setPTool]=useState("line");
  const [anns,setAnns]=useState([]);
  const [drawing,setDrawing]=useState(false);
  const [dStart,setDStart]=useState(null);
  const [dCur,setDCur]=useState(null);
  const [lMid,setLMid]=useState(null);
  const [lPhase,setLPhase]=useState(0);
  const [fTool,setFTool]=useState("wall");
  const [fObjs,setFObjs]=useState([]);
  const [sel,setSel]=useState(-1);
  const [pendFix,setPendFix]=useState(null);
  const [fDraw,setFDraw]=useState(false);
  const [fStart,setFStart]=useState(null);
  const [fCur,setFCur]=useState(null);
  const [modal,setModal]=useState(null);
  const [mVal,setMVal]=useState("");
  const [cSize,setCSize]=useState({w:800,h:600});
  const [cmPerGrid,setCmPerGrid]=useState(10);   // 平面圖比例：每格 = N 公分
  const [autoDim,setAutoDim]=useState(true);     // 尺寸線自動填入長度，免輸入
  const [toast,setToast]=useState("");
  const [,bump]=useState(0);

  const areaRef=useRef(null),svgRef=useRef(null),imgRef=useRef(null),fileRef=useRef(null);
  const annsRef=useRef([]),fObjsRef=useRef([]);
  const past=useRef([]),future=useRef([]);
  const dragRef=useRef(null),erasing=useRef(false),toastT=useRef(null);

  const isPhoto=mode==="photo";
  const tool=isPhoto?pTool:fTool;
  const items=isPhoto?anns:fObjs;
  const getList=()=>isPhoto?annsRef.current:fObjsRef.current;
  const setList=next=>{const nl=typeof next==="function"?next(getList()):next;if(isPhoto){annsRef.current=nl;setAnns(nl)}else{fObjsRef.current=nl;setFObjs(nl)}};
  const say=msg=>{setToast(msg);clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToast(""),1800)};

  /* ── 歷史（復原 / 重做）── */
  const pushHist=()=>{past.current.push({anns:annsRef.current,fObjs:fObjsRef.current});if(past.current.length>60)past.current.shift();future.current=[];bump(n=>n+1)};
  const applySnap=s=>{annsRef.current=s.anns;fObjsRef.current=s.fObjs;setAnns(s.anns);setFObjs(s.fObjs);setSel(-1)};
  const undo=()=>{const s=past.current.pop();if(!s)return;future.current.push({anns:annsRef.current,fObjs:fObjsRef.current});applySnap(s);bump(n=>n+1);say("已復原")};
  const redo=()=>{const s=future.current.pop();if(!s)return;past.current.push({anns:annsRef.current,fObjs:fObjsRef.current});applySnap(s);bump(n=>n+1);say("已重做")};

  /* ── 容器尺寸 ── */
  useEffect(()=>{
    const el=areaRef.current;if(!el)return;
    const ro=new ResizeObserver(es=>{for(const e of es)setCSize({w:e.contentRect.width,h:e.contentRect.height})});
    ro.observe(el);setCSize({w:el.clientWidth,h:el.clientHeight});
    return()=>ro.disconnect();
  },[]);

  /* ── 自動儲存 / 還原 ── */
  useEffect(()=>{
    try{
      const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
      if(s&&(s.anns?.length||s.fObjs?.length||s.photoSrc)){
        annsRef.current=s.anns||[];fObjsRef.current=s.fObjs||[];
        setAnns(annsRef.current);setFObjs(fObjsRef.current);
        if(s.photoSrc)setPhotoSrc(s.photoSrc);
        if(s.cmPerGrid)setCmPerGrid(s.cmPerGrid);
        if(typeof s.autoDim==="boolean")setAutoDim(s.autoDim);
        say("已還原上次的標註");
      }
    }catch(e){}
  },[]);
  useEffect(()=>{
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({anns,fObjs,cmPerGrid,autoDim,photoSrc:photoSrc&&photoSrc.length<2500000?photoSrc:null}))}catch(e){}
  },[anns,fObjs,photoSrc,cmPerGrid,autoDim]);

  const getP=useCallback(e=>{const el=areaRef.current;if(!el)return{x:0,y:0};const r=el.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}},[]);
  const gsnap=v=>Math.round(v/GRID)*GRID;
  const gs=p=>({x:gsnap(p.x),y:gsnap(p.y)});
  const snapHV=(s,p)=>{let x=p.x,y=p.y;if(Math.abs(p.x-s.x)<15)x=s.x;if(Math.abs(p.y-s.y)<15)y=s.y;return{x,y}};
  const lenCm=(a,b)=>Math.round(Math.hypot(b.x-a.x,b.y-a.y)/GRID*cmPerGrid);

  /* ── 對話框：resolve null = 取消 ── */
  const ask=(title,ph,init="")=>new Promise(res=>{setMVal(init||"");setModal({title,ph,res})});
  const closeMdl=v=>{if(modal){if(v!==null)saveRecent(modal.title,v);modal.res(v)}setModal(null);setMVal("")};

  /* ── 照片 ── */
  const loadPhoto=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{if(annsRef.current.length){pushHist();annsRef.current=[];setAnns([]);say("已載入新照片，舊標註已清空（↩ 可復原）")}setPhotoSrc(ev.target.result);setSel(-1)};r.readAsDataURL(f);e.target.value=""};

  /* ── 取消進行中的動作 ── */
  const cancelAll=()=>{setDrawing(false);setDStart(null);setDCur(null);setLMid(null);setLPhase(0);setFDraw(false);setFStart(null);setFCur(null);setPendFix(null);setSel(-1);dragRef.current=null;erasing.current=false};
  const pickTool=t=>{cancelAll();if(isPhoto)setPTool(t);else setFTool(t)};
  const switchMode=m=>{cancelAll();setMode(m)};

  /* ── 命中 / 刪除 / 編輯 ── */
  const findHit=p=>{const l=getList();for(let i=l.length-1;i>=0;i--)if(hitItem(l[i],p))return i;return-1};
  const eraseAt=p=>{const i=findHit(p);if(i<0)return;pushHist();setList(l=>l.filter((_,k)=>k!==i));setSel(-1)};
  const delSel=()=>{if(sel<0)return;pushHist();setList(l=>l.filter((_,k)=>k!==sel));setSel(-1);say("已刪除")};
  const clearAll=()=>{if(!getList().length)return;if(!confirm("清除全部標註？（可用 ↩ 復原）"))return;pushHist();setList([]);setSel(-1)};
  const editSel=async()=>{
    const it=items[sel];if(!it)return;
    if(it.type==="lshape"){
      const v1=await ask("第一段尺寸","例：70公分",it.label1);if(v1===null)return;
      const v2=await ask("第二段尺寸","例：40公分",it.label2);if(v2===null)return;
      pushHist();setList(l=>l.map((x,i)=>i===sel?{...x,label1:v1,label2:v2}:x));return;
    }
    if(!("label" in it))return;
    const title=it.type==="text"?"輸入文字":it.type==="arrow"?"離地描述":"輸入尺寸";
    const v=await ask(title,"",it.label);if(v===null)return;
    pushHist();setList(l=>l.map((x,i)=>i===sel?{...x,label:v}:x));
  };
  const updSel=fn=>setList(l=>l.map((x,i)=>i===sel?fn(x):x));
  const rotS=d=>{pushHist();updSel(x=>({...x,rotation:((x.rotation||0)+d)%360}))};
  const flipS=()=>{pushHist();updSel(x=>({...x,flipped:!x.flipped}))};
  const scaleS=f=>{pushHist();updSel(x=>({...x,scale:(x.scale||1)*f}))};
  const dupSel=()=>{const it=items[sel];if(!it)return;pushHist();const c=shiftItem(it,GRID*2,GRID*2);setList(l=>[...l,c]);setSel(items.length);say("已複製")};

  /* ── 指標事件 ── */
  const onDown=e=>{
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch(err){}
    const p=getP(e);
    if(isPhoto&&!photoSrc)return;
    if(tool==="eraser"){erasing.current=true;eraseAt(p);return}
    if(tool==="select"){
      const i=findHit(p);setSel(i);
      if(i>=0){pushHist();dragRef.current={idx:i,start:p,orig:getList()[i],moved:false}}
      return;
    }
    if(isPhoto){
      if(pTool==="text"){ask("輸入文字","例：水平扶手上緣離地約70公分").then(v=>{if(v){pushHist();setList(a=>[...a,{type:"text",x:p.x,y:p.y,label:v}])}});return}
      if(pTool==="lshape"){
        if(lPhase===0){setDStart(p);setLPhase(1);setDrawing(true)}
        else if(lPhase===1){setLMid(p);setLPhase(2)}
        return;
      }
      setDStart(p);setDrawing(true);
    }else{
      const sp=gs(p);
      if(pendFix){pushHist();setList(o=>[...o,{type:"fixture",fixture:pendFix,x:sp.x,y:sp.y,rotation:0,scale:1,flipped:false}]);return}
      setFStart(sp);setFDraw(true);
    }
  };

  const onMove=e=>{
    e.preventDefault();
    const p=getP(e);
    if(erasing.current){eraseAt(p);return}
    const d=dragRef.current;
    if(d){
      let dx=p.x-d.start.x,dy=p.y-d.start.y;
      if(!isPhoto){dx=gsnap(dx);dy=gsnap(dy)}
      if(dx||dy)d.moved=true;
      setList(l=>l.map((it,i)=>i===d.idx?shiftItem(d.orig,dx,dy):it));
      return;
    }
    if(isPhoto&&drawing)setDCur(p);
    else if(!isPhoto&&fDraw)setFCur(gs(p));
  };

  const onUp=async e=>{
    e.preventDefault();
    const p=getP(e);
    if(erasing.current){erasing.current=false;return}
    if(dragRef.current){const d=dragRef.current;dragRef.current=null;if(!d.moved){past.current.pop();bump(n=>n+1)}return}
    if(isPhoto&&drawing){
      if(pTool==="lshape"&&lPhase!==2)return;
      setDrawing(false);setDCur(null);
      if(pTool==="line"){
        const s=snapHV(dStart,p);if(Math.hypot(s.x-dStart.x,s.y-dStart.y)<5)return;
        const lbl=await ask("輸入尺寸","例：70公分");if(lbl===null)return;
        pushHist();setList(a=>[...a,{type:"line",x1:dStart.x,y1:dStart.y,x2:s.x,y2:s.y,label:lbl}]);
      }else if(pTool==="lshape"){
        setLPhase(0);
        const v1=await ask("第一段尺寸","例：70公分");if(v1===null)return;
        const v2=await ask("第二段尺寸","例：40公分");if(v2===null)return;
        pushHist();setList(a=>[...a,{type:"lshape",x1:dStart.x,y1:dStart.y,mx:lMid.x,my:lMid.y,x2:p.x,y2:p.y,label1:v1,label2:v2}]);
      }else if(pTool==="arrow"){
        if(Math.abs(p.y-dStart.y)<5)return;
        const lbl=await ask("離地描述","例：水平扶手上緣離地約70公分");if(lbl===null)return;
        pushHist();setList(a=>[...a,{type:"arrow",x:dStart.x,y1:dStart.y,y2:p.y,label:lbl}]);
      }
    }else if(!isPhoto&&fDraw){
      setFDraw(false);setFCur(null);
      if(!fStart)return;
      const sp=gs(p);
      if(fTool==="wall"||fTool==="handrail"){
        let ex=sp.x,ey=sp.y;
        if(Math.abs(sp.x-fStart.x)<Math.abs(sp.y-fStart.y))ex=fStart.x;else ey=fStart.y;
        if(Math.hypot(ex-fStart.x,ey-fStart.y)<5)return;
        pushHist();setList(o=>[...o,{type:fTool,x1:fStart.x,y1:fStart.y,x2:ex,y2:ey}]);
      }else if(fTool==="dim"){
        if(Math.hypot(sp.x-fStart.x,sp.y-fStart.y)<5)return;
        const auto=lenCm(fStart,sp)+"cm";
        let lbl=auto;
        if(!autoDim){lbl=await ask("輸入尺寸","例：120cm",auto);if(lbl===null)return}
        pushHist();setList(o=>[...o,{type:"dim",x1:fStart.x,y1:fStart.y,x2:sp.x,y2:sp.y,label:lbl}]);
      }
    }
  };

  /* ── 鍵盤快捷鍵 ── */
  const kb=useRef(null);
  kb.current=e=>{
    if(modal)return;
    const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;
    const k=e.key,mod=e.ctrlKey||e.metaKey;
    if(mod&&k.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
    if(mod&&k.toLowerCase()==="y"){e.preventDefault();redo();return}
    if(k==="Delete"||k==="Backspace"){if(sel>=0){e.preventDefault();delSel()}return}
    if(k==="Escape"){cancelAll();return}
    const map=isPhoto?{"1":"line","2":"lshape","3":"arrow","4":"text",v:"select",V:"select",e:"eraser",E:"eraser"}:{"1":"wall","2":"handrail","3":"dim",v:"select",V:"select",e:"eraser",E:"eraser"};
    if(map[k])pickTool(map[k]);
  };
  useEffect(()=>{const h=e=>kb.current&&kb.current(e);window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);

  /* ── 匯出照片 ── */
  const doExport=()=>{
    if(!photoSrc||!imgRef.current)return;
    const img=imgRef.current;
    const cv=document.createElement("canvas");
    cv.width=img.naturalWidth;cv.height=img.naturalHeight;
    const ctx=cv.getContext("2d");ctx.drawImage(img,0,0);
    const imgR=img.getBoundingClientRect(),aR=areaRef.current.getBoundingClientRect();
    const ox=imgR.left-aR.left,oy=imgR.top-aR.top;
    const sx=img.naturalWidth/imgR.width,sy=img.naturalHeight/imgR.height;
    anns.forEach(a=>{
      const m=(x,y)=>({x:(x-ox)*sx,y:(y-oy)*sy});
      ctx.lineCap="round";
      if(a.type==="line"){const p1=m(a.x1,a.y1),p2=m(a.x2,a.y2);ctx.strokeStyle="#F00";ctx.lineWidth=6*sx;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();if(a.label)cLbl(ctx,(p1.x+p2.x)/2,(p1.y+p2.y)/2-25*sy,a.label,22*sx)}
      else if(a.type==="lshape"){const p1=m(a.x1,a.y1),pm=m(a.mx,a.my),p2=m(a.x2,a.y2);ctx.strokeStyle="#F00";ctx.lineWidth=6*sx;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(pm.x,pm.y);ctx.stroke();ctx.beginPath();ctx.moveTo(pm.x,pm.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();if(a.label1)cLbl(ctx,(p1.x+pm.x)/2,(p1.y+pm.y)/2-25*sy,a.label1,22*sx);if(a.label2)cLbl(ctx,(pm.x+p2.x)/2,(pm.y+p2.y)/2-25*sy,a.label2,22*sx)}
      else if(a.type==="arrow"){const px=m(a.x,0).x,y1=m(0,a.y1).y,y2=m(0,a.y2).y;ctx.strokeStyle="#FFD600";ctx.fillStyle="#FFD600";ctx.lineWidth=3*sx;ctx.beginPath();ctx.moveTo(px,y1);ctx.lineTo(px,y2);ctx.stroke();const h=12*sx;ctx.beginPath();ctx.moveTo(px,y1);ctx.lineTo(px-6*sx,y1+h);ctx.lineTo(px+6*sx,y1+h);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(px,y2);ctx.lineTo(px-6*sx,y2-h);ctx.lineTo(px+6*sx,y2-h);ctx.closePath();ctx.fill();if(a.label)cLbl(ctx,px,y2+30*sy,a.label,22*sx)}
      else if(a.type==="text"){const pt=m(a.x,a.y);cLbl(ctx,pt.x,pt.y,a.label,22*sx)}
    });
    cv.toBlob(blob=>{
      if(!blob)return;
      const url=URL.createObjectURL(blob);
      if(navigator.share&&navigator.canShare){const f=new File([blob],'annotated.png',{type:'image/png'});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>dlk(url));return}}
      dlk(url);
    },'image/png');
  };
  function dlk(u){const a=document.createElement("a");a.href=u;a.download="annotated_"+Date.now()+".png";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),3000)}
  function cLbl(ctx,x,y,text,fs){
    ctx.font=`900 ${fs}px 'Noto Sans TC',sans-serif`;const tw=ctx.measureText(text).width,px=12,py=6;
    ctx.fillStyle="rgba(255,214,0,0.92)";const rx=x-tw/2-px,ry=y-fs/2-py,rw=tw+px*2,rh=fs+py*2,r=6;
    ctx.beginPath();ctx.moveTo(rx+r,ry);ctx.lineTo(rx+rw-r,ry);ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+r);ctx.lineTo(rx+rw,ry+rh-r);ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-r,ry+rh);ctx.lineTo(rx+r,ry+rh);ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-r);ctx.lineTo(rx,ry+r);ctx.quadraticCurveTo(rx,ry,rx+r,ry);ctx.closePath();ctx.fill();
    ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,x,y);
  }

  /* ── 匯出平面圖 ── */
  const expFloor=()=>{
    const oldSel=sel;setSel(-1);
    setTimeout(()=>{
      const svgEl=svgRef.current;if(!svgEl)return;
      const data=new XMLSerializer().serializeToString(svgEl);
      const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement("canvas");cv.width=cSize.w;cv.height=cSize.h;
        const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0);
        URL.revokeObjectURL(url);
        cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b);dlk(u);setSel(oldSel)},'image/png');
      };
      img.src=url;
    },50);
  };

  /* ── 預覽（含即時長度） ── */
  const preview=()=>{
    if(isPhoto&&drawing&&dStart&&dCur){
      if(pTool==="line"){const s=snapHV(dStart,dCur);return <line x1={dStart.x} y1={dStart.y} x2={s.x} y2={s.y} stroke="#F00" strokeWidth={5} strokeLinecap="round"/>}
      if(pTool==="lshape"){
        if(lPhase===1)return <line x1={dStart.x} y1={dStart.y} x2={dCur.x} y2={dCur.y} stroke="#F00" strokeWidth={5} strokeLinecap="round"/>;
        if(lPhase===2&&lMid)return <g><line x1={dStart.x} y1={dStart.y} x2={lMid.x} y2={lMid.y} stroke="#F00" strokeWidth={5} strokeLinecap="round"/><line x1={lMid.x} y1={lMid.y} x2={dCur.x} y2={dCur.y} stroke="#F00" strokeWidth={5} strokeLinecap="round"/></g>;
      }
      if(pTool==="arrow")return <g><line x1={dStart.x} y1={dStart.y} x2={dStart.x} y2={dCur.y} stroke="#FFD600" strokeWidth={3}/><polygon points={`${dStart.x},${dStart.y} ${dStart.x-6},${dStart.y+12} ${dStart.x+6},${dStart.y+12}`} fill="#FFD600"/><polygon points={`${dStart.x},${dCur.y} ${dStart.x-6},${dCur.y-12} ${dStart.x+6},${dCur.y-12}`} fill="#FFD600"/></g>;
    }
    if(!isPhoto&&fDraw&&fStart&&fCur&&(fTool==="wall"||fTool==="handrail"||fTool==="dim")){
      let ex=fCur.x,ey=fCur.y;
      if(fTool!=="dim"){if(Math.abs(fCur.x-fStart.x)<Math.abs(fCur.y-fStart.y))ex=fStart.x;else ey=fStart.y}
      const cm=lenCm(fStart,{x:ex,y:ey});
      const col=fTool==="wall"?"#222":fTool==="handrail"?"#F00":"#555";
      return <g><line x1={fStart.x} y1={fStart.y} x2={ex} y2={ey} stroke={col} strokeWidth={fTool==="wall"?6:fTool==="handrail"?4:1.5} strokeLinecap="round"/>
        {cm>0&&<text x={(fStart.x+ex)/2} y={(fStart.y+ey)/2-10} textAnchor="middle" fontSize={13} fontWeight={700} fill="#3498db" fontFamily="'Noto Sans TC',sans-serif">{cm}cm</text>}</g>;
    }
    return null;
  };

  const selItem=sel>=0?items[sel]:null;
  const selBox=selItem?bboxOf(selItem):null;

  const gridLines=[];
  for(let x=0;x<=cSize.w;x+=GRID)gridLines.push(<line key={`gx${x}`} x1={x} y1={0} x2={x} y2={cSize.h} stroke="#ddd" strokeWidth={0.5}/>);
  for(let y=0;y<=cSize.h;y+=GRID)gridLines.push(<line key={`gy${y}`} x1={0} y1={y} x2={cSize.w} y2={y} stroke="#ddd" strokeWidth={0.5}/>);

  const B=on=>({fontSize:11,padding:"5px 9px",border:`1px solid ${on?"#e94560":"#444"}`,borderRadius:5,background:on?"#e94560":"#252545",color:on?"#fff":"#eee",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",fontWeight:on?700:500});
  const FB={fontSize:12,padding:"6px 10px",border:"1px solid #333",borderRadius:5,background:"#252545",color:"#eee",cursor:"pointer",fontFamily:"inherit"};
  const Sep=()=><div style={{width:1,height:18,background:"#333",margin:"0 2px"}}/>;
  const CommonBtns=()=>(<>
    <Sep/>
    <button style={B(tool==="select")} title="選取 (V)" onClick={()=>pickTool("select")}>☝ 選取</button>
    <button style={B(tool==="eraser")} title="橡皮擦 (E)" onClick={()=>pickTool("eraser")}>🧹 橡皮擦</button>
    <Sep/>
    <button style={B(false)} title="復原 (Ctrl+Z)" disabled={!past.current.length} onClick={undo}>↩</button>
    <button style={B(false)} title="重做 (Ctrl+Shift+Z)" disabled={!future.current.length} onClick={redo}>↪</button>
    <button style={{...B(false),borderColor:"#c0392b",color:"#e74c3c"}} title="全部清除" disabled={!items.length} onClick={clearAll}>🗑</button>
    <Sep/>
  </>);

  const hint=isPhoto
    ?{line:"拖曳畫線 → 輸入尺寸",lshape:lPhase===0?"① 點起點":lPhase===1?"② 在轉角按住，拖到終點放開":"③ 放開完成",arrow:"由上往下拖曳 → 輸入離地描述",text:"點一下放置文字",select:"點標註選取，拖曳移動，Del 刪除，✏ 改字",eraser:"點或劃過標註即刪除"}[pTool]
    :pendFix?`點畫布放置：${FIX_LBL[pendFix]}（Esc 取消）`:{wall:"拖曳畫牆（自動水平/垂直）",handrail:"拖曳畫扶手",dim:autoDim?"拖曳即自動標上長度":"拖曳 → 輸入尺寸（已預填長度）",select:"點元件選取，拖曳移動，Del 刪除",eraser:"點或劃過元件即刪除"}[fTool];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#111",fontFamily:"'Noto Sans TC',sans-serif",color:"#eee",overflow:"hidden"}}>

        <div style={{display:"flex",gap:2,background:"#111",borderRadius:6,padding:2}}>

          <button style={{padding:"5px 12px",border:"none",borderRadius:5,background:!isPhoto?"#e94560":"transparent",color:!isPhoto?"#fff":"#888",fontSize:12,fontWeight:!isPhoto?700:500,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>switchMode("floor")}>📐 平面圖</button>

          <div style={{display:"flex",gap:3,alignItems:"center",flexWrap:"wrap"}}>

          {isPhoto&&photoSrc&&(
            <div style={{position:"absolute",left:0,top:0,width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <img ref={imgRef} src={photoSrc} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",pointerEvents:"none",userSelect:"none"}} alt=""/>
            </div>

          <svg ref={svgRef} viewBox={`0 0 ${cSize.w} ${cSize.h}`} width={cSize.w} height={cSize.h} style={{position:"absolute",left:0,top:0,zIndex:10,touchAction:"none",cursor:tool==="select"?"default":tool==="eraser"?"cell":"crosshair"}} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
            <rect x={0} y={0} width={cSize.w} height={cSize.h} fill="transparent"/>
            {!isPhoto&&gridLines}

            {isPhoto&&anns.map((a,i)=>(
              <g key={i} opacity={sel>=0&&i!==sel&&tool==="select"?0.6:1}>
                {a.type==="line"&&<><line x1={a.x1} y1={a.y1} x2={a.x2} y2={a.y2} stroke="#F00" strokeWidth={5} strokeLinecap="round"/>{a.label&&<YellowLabel x={(a.x1+a.x2)/2} y={(a.y1+a.y2)/2-25} text={a.label}/>}</>}
                {a.type==="lshape"&&<><line x1={a.x1} y1={a.y1} x2={a.mx} y2={a.my} stroke="#F00" strokeWidth={5} strokeLinecap="round"/><line x1={a.mx} y1={a.my} x2={a.x2} y2={a.y2} stroke="#F00" strokeWidth={5} strokeLinecap="round"/>{a.label1&&<YellowLabel x={(a.x1+a.mx)/2} y={(a.y1+a.my)/2-25} text={a.label1}/>}{a.label2&&<YellowLabel x={(a.mx+a.x2)/2} y={(a.my+a.y2)/2-25} text={a.label2}/>}</>}
                {a.type==="arrow"&&<><line x1={a.x} y1={a.y1} x2={a.x} y2={a.y2} stroke="#FFD600" strokeWidth={3}/><polygon points={`${a.x},${a.y1} ${a.x-6},${a.y1+12} ${a.x+6},${a.y1+12}`} fill="#FFD600"/><polygon points={`${a.x},${a.y2} ${a.x-6},${a.y2-12} ${a.x+6},${a.y2-12}`} fill="#FFD600"/>{a.label&&<YellowLabel x={a.x} y={a.y2+25} text={a.label}/>}</>}
                {a.type==="text"&&<YellowLabel x={a.x} y={a.y} text={a.label}/>}

              <g key={i}>
                {o.type==="wall"&&<line x1={o.x1} y1={o.y1} x2={o.x2} y2={o.y2} stroke="#222" strokeWidth={6} strokeLinecap="round"/>}
                {o.type==="handrail"&&<><line x1={o.x1} y1={o.y1} x2={o.x2} y2={o.y2} stroke="#F00" strokeWidth={4} strokeLinecap="round"/><circle cx={o.x1} cy={o.y1} r={4} fill="#F00"/><circle cx={o.x2} cy={o.y2} r={4} fill="#F00"/></>}

            <div style={{position:"absolute",left:Math.max(6,Math.min(selBox.x1,cSize.w-330)),top:selBox.y1>50?selBox.y1-44:Math.min(selBox.y2+8,cSize.h-44),zIndex:100,display:"flex",flexWrap:"wrap",gap:4,background:"#1a1a2e",border:"1px solid #333",borderRadius:8,padding:5,boxShadow:"0 4px 16px rgba(0,0,0,.5)"}}>
              {selItem.type==="fixture"&&<>
                <button style={FB} onClick={()=>rotS(90)}>🔄 90°</button>

            </div>

        </div>

                {FIX_EMJ[f]} {FIX_LBL[f]}

            <div style={{fontSize:11,color:"#888",marginTop:12,marginBottom:4,letterSpacing:1}}>比例</div>
            <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11}}>每格 = <input type="number" min={1} value={cmPerGrid} onChange={e=>setCmPerGrid(Math.max(1,Number(e.target.value)||1))} style={{width:44,padding:3,border:"1px solid #333",borderRadius:4,background:"#252545",color:"#eee",fontFamily:"inherit",fontSize:11}}/> cm</div>

            <div style={{fontSize:10,color:"#666",lineHeight:1.6}}>• 畫牆/扶手時即時顯示長度<br/>• 「選取」可點任何線或元件：拖曳移動、Del 刪除<br/>• 「橡皮擦」劃過即刪<br/>• Ctrl+Z 復原、Esc 取消<br/>• 快捷鍵 1/2/3 工具、V 選取、E 橡皮擦</div>
          </div>
        )}
      </div>

      {/* 狀態列 */}
      <div style={{padding:"3px 10px",background:"#1a1a2e",borderTop:"1px solid #333",fontSize:10,color:"#888",flexShrink:0,display:"flex",justifyContent:"space-between",gap:8}}>
        <span>{isPhoto?"照片標註":"平面圖"} | {hint}</span>
        <span>{items.length} 筆</span>
      </div>

      {/* 輸入對話框 */}
      {modal&&(()=>{
        const chips=[...new Set([...loadRecent(modal.title),...(QUICK[modal.title]||[])])];
        return(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center"}} onPointerDown={e=>{if(e.target===e.currentTarget)closeMdl(null)}}>
          <div style={{background:"#1a1a2e",border:"1px solid #333",borderRadius:12,padding:16,width:320,maxWidth:"94vw"}}>
            <div style={{fontSize:14,marginBottom:10,color:"#e94560",fontWeight:700}}>{modal.title}</div>
            <input style={{width:"100%",padding:8,border:"1px solid #333",borderRadius:6,background:"#252545",color:"#eee",fontSize:14,fontFamily:"inherit",marginBottom:8}} value={mVal} onChange={e=>setMVal(e.target.value)} placeholder={modal.ph} autoFocus onFocus={e=>e.target.select()} onKeyDown={e=>{if(e.key==="Enter")closeMdl(mVal);if(e.key==="Escape")closeMdl(null)}}/>
            {chips.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
              {chips.map(c=><button key={c} style={{fontSize:11,padding:"4px 8px",border:"1px solid #444",borderRadius:12,background:"#252545",color:"#eee",cursor:"pointer",fontFamily:"inherit"}} onClick={()=>closeMdl(c)}>{c}</button>)}
            </div>}
            <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
              <button style={{padding:"7px 16px",background:"#252545",color:"#888",border:"1px solid #333",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>closeMdl(null)}>取消</button>
              <button style={{padding:"7px 16px",background:"#e94560",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}} onClick={()=>closeMdl(mVal)}>確定</button>
            </div>
          </div>
        </div>);
      })()}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
