<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Skill 官方指南 5 大重點｜知識點影片</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070b18; --bg1:#0f1733; --ink:#f4f6ff; --mute:#9aa6c9;
  --amber:#f5b942; --coral:#ff6b5c; --teal:#3dd6c4; --violet:#8b7bff; --sky:#5ac8ff;
  --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Noto Sans TC','WenQuanYi Zen Hei',sans-serif;color:var(--ink)}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(1200px 800px at 50% 30%,var(--bg1),var(--bg0) 70%);perspective:1700px;perspective-origin:50% 42%;transform-origin:center;flex:none}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.scene{position:absolute;inset:0;transform-style:preserve-3d;display:none}
.scene.on{display:block}
.abs{position:absolute}
.c{left:50%;top:50%}
.p3{transform-style:preserve-3d}
.face{position:absolute;backface-visibility:hidden}
.card{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1.5px solid var(--line);border-radius:28px;box-shadow:0 40px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.chip{display:inline-block;padding:10px 22px;border-radius:999px;font-weight:700;font-size:28px;border:1.5px solid var(--line);background:var(--glass)}
.t1{font-weight:900;font-size:96px;letter-spacing:.02em;line-height:1.15}
.t2{font-weight:900;font-size:64px;line-height:1.2}
.t3{font-weight:700;font-size:40px;line-height:1.35}
.t4{font-weight:400;font-size:30px;line-height:1.5;color:var(--mute)}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.amber{color:var(--amber)}.coral{color:var(--coral)}.teal{color:var(--teal)}.violet{color:var(--violet)}.sky{color:var(--sky)}
.nowrap{white-space:nowrap}
/* floor */
.floor{position:absolute;left:50%;top:62%;width:5000px;height:5000px;margin-left:-2500px;transform-origin:50% 0;transform:rotateX(78deg);
  background-image:linear-gradient(rgba(61,214,196,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(61,214,196,.16) 2px,transparent 2px);background-size:140px 140px;
  -webkit-mask-image:radial-gradient(ellipse 45% 40% at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse 45% 40% at 50% 0%,#000 20%,transparent 70%)}
.glow{position:absolute;left:50%;top:62%;width:1400px;height:500px;margin:-250px 0 0 -700px;background:radial-gradient(ellipse at center,rgba(61,214,196,.18),transparent 65%);pointer-events:none}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;opacity:.5}
/* subtitles */
.sub{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);max-width:1760px;padding:18px 44px;border-radius:22px;background:rgba(5,8,20,.72);border:1px solid rgba(255,255,255,.12);font-size:42px;font-weight:700;line-height:1.4;text-align:center;letter-spacing:.02em;box-shadow:0 20px 50px rgba(0,0,0,.4);white-space:nowrap}
.sub b{color:var(--amber);font-weight:900}
.wm{position:absolute;right:44px;top:34px;font-size:24px;color:var(--mute);letter-spacing:.08em;font-weight:700;opacity:.8}
/* robot */
.robot{position:absolute;width:260px;height:300px;transform-style:preserve-3d}
.robot .head{position:absolute;left:30px;top:40px;width:200px;height:150px;border-radius:40px;background:linear-gradient(160deg,#5ac8ff,#2b7fd6);box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 -14px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.35)}
.robot .eye{position:absolute;top:50px;width:38px;height:46px;border-radius:50%;background:#fff;box-shadow:inset 0 -12px 0 #0e2a4a;transform-origin:center}
.robot .eye.l{left:44px}.robot .eye.r{right:44px}
.robot .mouth{position:absolute;left:78px;bottom:26px;width:44px;height:12px;border-radius:0 0 20px 20px;background:#0e2a4a}
.robot .ant{position:absolute;left:118px;top:0;width:24px;height:50px;background:#2b7fd6;border-radius:12px}
.robot .ant:after{content:"";position:absolute;left:-8px;top:-18px;width:40px;height:40px;border-radius:50%;background:var(--amber);box-shadow:0 0 30px var(--amber)}
.robot .body{position:absolute;left:50px;top:200px;width:160px;height:100px;border-radius:30px 30px 20px 20px;background:linear-gradient(160deg,#4aa8f0,#1e5fae);box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 4px 0 rgba(255,255,255,.3)}
.robot .body:after{content:"";position:absolute;left:60px;top:28px;width:40px;height:40px;border-radius:50%;background:var(--teal);box-shadow:0 0 24px var(--teal)}
/* book */
.bookwrap{position:absolute;transform-style:preserve-3d}
.cover{background:linear-gradient(160deg,#ff8a6b,#c43d2e);border-radius:6px 22px 22px 6px;box-shadow:inset 0 0 0 10px rgba(255,255,255,.12)}
.pages{background:repeating-linear-gradient(0deg,#f1eee6 0 6px,#d9d4c6 6px 8px)}
.spine{background:linear-gradient(90deg,#9c2a1f,#d94c3a);border-radius:6px 0 0 6px}
/* shelf */
.shelfbar{position:absolute;height:34px;background:linear-gradient(#5b3b23,#3a2414);border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.bk{position:absolute;bottom:0;transform-style:preserve-3d}
.bk .sp{position:absolute;left:0;top:0;border-radius:4px;box-shadow:inset -4px 0 0 rgba(0,0,0,.25),inset 2px 0 0 rgba(255,255,255,.25)}
/* folder */
.fback{background:linear-gradient(160deg,#f7cf66,#e09a1e);border-radius:24px}
.ffront{background:linear-gradient(160deg,#ffe28a,#f2b53a);border-radius:24px;transform-origin:50% 100%}
.ftab{position:absolute;left:0;top:-40px;width:260px;height:60px;border-radius:18px 18px 0 0;background:#e09a1e}
.doc{position:absolute;width:300px;height:380px;border-radius:18px;background:#fff;color:#111;box-shadow:0 40px 80px rgba(0,0,0,.5);overflow:hidden}
.solid{background:linear-gradient(160deg,#1a2347,#0e1430)!important;backdrop-filter:none!important}
.doc .hd{height:70px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;color:#fff}
.doc .ln{height:12px;border-radius:6px;background:#d4d8e6;margin:16px 28px 0}
.doc .ln.s{width:45%}
/* misc */
.bar{position:absolute;height:60px;border-radius:30px;background:linear-gradient(90deg,var(--violet),var(--sky));box-shadow:0 20px 40px rgba(0,0,0,.4)}
.ok{color:var(--teal)}.bad{color:var(--coral)}
.step{position:absolute;width:280px;text-align:center}
.step .n{width:110px;height:110px;border-radius:36px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px;color:#111;background:linear-gradient(160deg,#fff,#dfe5ff);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.tile{position:absolute;width:1200px;height:150px;border-radius:30px;display:flex;align-items:center;gap:34px;padding:0 44px;font-size:46px;font-weight:900}
.tile .k{width:92px;height:92px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#111;flex:none}
.xcard{width:800px;height:520px;padding:40px 48px;border-radius:34px;background:linear-gradient(160deg,#151c38,#0c1128);border:1.5px solid var(--line);box-shadow:0 50px 100px rgba(0,0,0,.6)}
.xhead{display:flex;align-items:center;gap:18px;font-weight:700;font-size:30px;color:var(--mute)}
.xhead .av{width:60px;height:60px;border-radius:50%;background:linear-gradient(160deg,#fff,#aab4ff)}
/* preview controls */
#ctl{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(0,0,0,.75);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:14px;color:#ccc;z-index:9;font-family:system-ui,sans-serif}
#ctl button{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:4px 12px;cursor:pointer}
#ctl input{flex:1}
body.render #ctl{display:none}
</style>
</head>
<body>
<div id="viewport"><div class="stage" id="stage">
  <div class="glow"></div>
  <div class="floor" id="floor"></div>
  <div class="world" id="world"></div>
  <div class="wm">Claude Skill 官方指南 · 5 大重點</div>
  <div class="sub" id="sub" style="opacity:0"></div>
</div></div>
<div id="ctl"><button id="play">▶ 播放</button><span id="tm">0.0s</span><input id="seek" type="range" min="0" max="168" step="0.05" value="0"><span>拖曳時間軸預覽 · 1920×1080</span></div>

<script>
/* ───────────── helpers ───────────── */
const TOTAL=168;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,s,d)=>clamp((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const S=(el,st)=>{for(const k in st)el.style[k]=st[k];};
const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const fmt=n=>n.toLocaleString('en-US');
// seeded random
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
// pop-in: scale+opacity with overshoot. base = transform prefix
function pop(e,t,s,d=.6,base='',from=.6){const x=P(t,s,d);S(e,{opacity:x<=0?0:1,transform:`${base} scale(${lerp(from,1,back(x))})`});}
function fade(e,t,s,d=.5,base=''){const x=eo(P(t,s,d));S(e,{opacity:x,transform:base});}
function rise(e,t,s,d=.7,base='',dy=60){const x=eo(P(t,s,d));S(e,{opacity:x,transform:`${base} translateY(${lerp(dy,0,x)}px)`});}
function hide(e){S(e,{opacity:0});}
// 3D box builder: faces front/back/left/right/top/bottom
function box(W,H,D,faces){
  const w=el(`<div class="abs p3" style="width:${W}px;height:${H}px;margin:${-H/2}px 0 0 ${-W/2}px"></div>`);
  const mk=(cls,w_,h_,tf,inner='')=>{const f=el(`<div class="face ${cls}" style="width:${w_}px;height:${h_}px;left:${(W-w_)/2}px;top:${(H-h_)/2}px;transform:${tf}">${inner}</div>`);w.appendChild(f);return f;};
  if(faces.front!==undefined)mk('front '+(faces.frontCls||''),W,H,`translateZ(${D/2}px)`,faces.front);
  if(faces.back!==undefined)mk('back '+(faces.backCls||''),W,H,`rotateY(180deg) translateZ(${D/2}px)`,faces.back);
  if(faces.left!==undefined)mk('left '+(faces.leftCls||''),D,H,`rotateY(-90deg) translateZ(${W/2}px)`,faces.left);
  if(faces.right!==undefined)mk('right '+(faces.rightCls||''),D,H,`rotateY(90deg) translateZ(${W/2}px)`,faces.right);
  if(faces.top!==undefined)mk('top '+(faces.topCls||''),W,D,`rotateX(90deg) translateZ(${H/2}px)`,faces.top);
  if(faces.bottom!==undefined)mk('bottom '+(faces.bottomCls||''),W,D,`rotateX(-90deg) translateZ(${H/2}px)`,faces.bottom);
  return w;
}
const ICO={
  doc:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h16l10 10v26H12z"/><path d="M28 6v10h10M18 26h14M18 34h14"/></svg>`,
  grid:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><rect x="7" y="7" width="14" height="14" rx="3"/><rect x="27" y="7" width="14" height="14" rx="3"/><rect x="7" y="27" width="14" height="14" rx="3"/><rect x="27" y="27" width="14" height="14" rx="3"/></svg>`,
  gear:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M24 4l4 5 6-1 2 6 6 2-1 6 5 4-5 4 1 6-6 2-2 6-6-1-4 5-4-5-6 1-2-6-6-2 1-6-5-4 5-4-1-6 6-2 2-6 6 1z"/><circle cx="24" cy="24" r="7"/></svg>`,
  loop:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 20a15 15 0 0 0-27-6M10 28a15 15 0 0 0 27 6"/><path d="M38 8v12H26M10 40V28h12"/></svg>`,
  check:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 26l10 10L40 12"/></svg>`,
  cross:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M12 12l24 24M36 12L12 36"/></svg>`,
  bulb:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 38h12M20 44h8M14 20a10 10 0 1 1 20 0c0 5-4 7-4 12H18c0-5-4-7-4-12z"/></svg>`,
  scissors:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="12" cy="14" r="6"/><circle cx="12" cy="34" r="6"/><path d="M17 18l24 14M17 30l24-14"/></svg>`,
  tag:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M6 6h18l18 18-18 18L6 24z"/><circle cx="15" cy="15" r="3"/></svg>`,
  road:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 42L18 6h12l12 36M24 12v6M24 24v6M24 36v6"/></svg>`,
  exam:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="32" height="36" rx="4"/><path d="M16 16l3 3 6-6M16 28l3 3 6-6M28 16h6M28 28h6"/></svg>`,
  bot:`<svg viewBox="0 0 48 48" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="26" rx="8"/><circle cx="18" cy="26" r="3" fill="currentColor"/><circle cx="30" cy="26" r="3" fill="currentColor"/><path d="M24 14V6M18 34h12"/></svg>`,
};
const world=$('#world');
const scenes=[];
function scene(id,start,end,build,render){const e=el(`<div class="scene" id="${id}"></div>`);world.appendChild(e);const ctx=build(e)||{};scenes.push({id,start,end,e,ctx,render});}

/* ───────────── background particles ───────────── */
const dots=[];for(let i=0;i<46;i++){const d=el(`<div class="dot"></div>`);const z=-800+rnd()*900;d.dataset.x=rnd()*1920;d.dataset.y=rnd()*900;d.dataset.z=z;d.dataset.s=.4+rnd()*1.4;d.dataset.ph=rnd()*6.28;world.appendChild(d);dots.push(d);}
const dotsLayer=dots;

/* ───────────── 0. HOOK ───────────── */
scene('hook',0,10,e=>{
  e.innerHTML=`
  <div class="robot abs" id="hk-robot" style="left:830px;top:520px"><div class="ant"></div><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div><div class="body"></div></div>
  <div class="abs p3" id="hk-book" style="left:960px;top:500px"></div>
  <div class="abs" id="hk-dust" style="left:960px;top:640px"></div>
  <div class="abs p3" id="hk-gauge" style="left:1500px;top:440px"></div>
  <div class="abs t1 nowrap" id="hk-t1" style="left:150px;top:150px;opacity:0">塞給 AI 一本<span class="coral"> 500 頁</span>的說明書</div>
  <div class="abs t2 nowrap" id="hk-t2" style="left:150px;top:300px;opacity:0;color:var(--mute)">它不會變聰明</div>
  <div class="abs t1 nowrap" id="hk-t3" style="left:150px;top:390px;opacity:0"><span class="coral">只會變慢。</span></div>`;
  const bk=box(540,720,90,{front:`<div style="padding:60px 40px;color:#fff"><div style="font-size:34px;font-weight:700;opacity:.85">說 明 書</div><div style="font-size:150px;font-weight:900;line-height:1;margin-top:20px">500</div><div style="font-size:54px;font-weight:900">頁</div><div style="position:absolute;left:40px;bottom:50px;font-size:26px;opacity:.75">USER MANUAL · v1 · 全部都要讀</div></div>`,frontCls:'cover',back:'',backCls:'cover',left:'',leftCls:'spine',right:'',rightCls:'pages',top:'',topCls:'pages',bottom:'',bottomCls:'pages'});
  $('#hk-book',e).appendChild(bk);
  const g=$('#hk-gauge',e);g.innerHTML=`<div class="card abs" style="left:-220px;top:-150px;width:440px;height:300px;padding:28px 30px">
    <div class="t4" style="font-size:26px;letter-spacing:.1em">思考速度</div>
    <svg viewBox="0 0 440 240" width="380" height="207" style="display:block;margin:6px auto 0">
      <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#ff6b5c"/><stop offset=".5" stop-color="#f5b942"/><stop offset="1" stop-color="#3dd6c4"/></linearGradient></defs>
      <path d="M40 200 A180 180 0 0 1 400 200" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="26" stroke-linecap="round"/>
      <path d="M40 200 A180 180 0 0 1 400 200" fill="none" stroke="url(#gg)" stroke-width="26" stroke-linecap="round" stroke-dasharray="566" id="hk-arc"/>
      <g id="hk-needle" style="transform-origin:220px 200px"><path d="M220 200 L220 50" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="220" cy="200" r="16" fill="#fff"/></g>
    </svg></div>`;
  const dust=$('#hk-dust',e);for(let i=0;i<14;i++){dust.appendChild(el(`<div class="dot" style="width:18px;height:18px;background:#c9b9a6"></div>`));}
  return {bk,dust:$$('.dot',dust),needle:$('#hk-needle',e),robot:$('#hk-robot',e)};
},(t,e,c)=>{
  // book drops 0.4→1.4 with bounce, then rests on robot
  const d=P(t,.4,1.0);const y=lerp(-1100,0,ei(d));
  const bounce=t>1.4?Math.abs(Math.sin((t-1.4)*9))*Math.exp(-(t-1.4)*4)*40:0;
  const tilt=lerp(-25,72,eo(d));
  S(c.bk.parentElement,{transform:`translateY(${y-bounce}px) rotateX(${tilt}deg) rotateY(${lerp(-40,0,eo(d))}deg) rotateZ(${lerp(14,-6,eo(d))}deg)`,opacity:1});
  // robot squash on impact
  const imp=P(t,1.35,.25);const sq=t<1.35?1:lerp(.62,.72,eo(imp));
  const wob=t>1.6?Math.sin((t-1.6)*4)*2:0;
  S(c.robot,{transform:`translateY(${t<1.35?0:70}px) scaleY(${sq}) rotate(${wob}deg)`,transformOrigin:'50% 100%'});
  // sleepy eyes
  const sl=eo(P(t,4.5,2));$$('.eye',c.robot).forEach(ey=>S(ey,{transform:`scaleY(${lerp(1,.35,sl)})`}));
  // dust
  c.dust.forEach((d,i)=>{const a=P(t,1.35,.9);const ang=(i/14)*6.28;S(d,{opacity:a<=0?0:(1-a)*.8,transform:`translate(${Math.cos(ang)*lerp(0,260,eo(a))}px,${Math.sin(ang)*lerp(0,80,eo(a))-a*40}px) scale(${lerp(.6,1.6,a)})`});});
  // texts
  rise($('#hk-t1',e),t,.2,.7);
  rise($('#hk-t2',e),t,4.2,.6);
  rise($('#hk-t3',e),t,7.2,.6);
  // gauge
  const g=$('#hk-gauge',e);pop(g,t,3.6,.7,'rotateY(-18deg) translateZ(40px)');
  const n=lerp(60,-80,eo(P(t,4.3,3.2)));S(c.needle,{transform:`rotate(${n}deg)`});
  const arcP=lerp(1,.18,eo(P(t,4.3,3.2)));$('#hk-arc',e).setAttribute('stroke-dashoffset',String(566*(1-arcP)));
});

/* ───────────── 1. TITLE ───────────── */
scene('title',10,16,e=>{
  e.innerHTML=`
  <div class="abs p3 c" id="ti-blk" style="width:1520px">
    <div class="t4" style="font-size:34px;letter-spacing:.3em;color:var(--teal);font-weight:700">ANTHROPIC 官方 · SKILL AUTHORING BEST PRACTICES</div>
